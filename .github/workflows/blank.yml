
name: PC criado pelo @alves7.pcm

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  deploy-rdp:
    runs-on: windows-11-arm
    timeout-minutes: 360

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ============================================================
    # INFORMACOES DO SISTEMA
    # ============================================================
    - name: System Information
      shell: powershell
      run: |
        Write-Host "=== ENIGMANO RDP DEPLOYMENT ===" -ForegroundColor Green
        Write-Host "Instance Number: ${{ github.event.inputs.instance_number }}" -ForegroundColor Yellow
        Write-Host "Runner: $env:RUNNER_NAME" -ForegroundColor Yellow
        Write-Host "Workflow: $env:GITHUB_WORKFLOW" -ForegroundColor Yellow

        Write-Host "`n=== SYSTEM SPECIFICATIONS ===" -ForegroundColor Cyan

        Get-ComputerInfo |
          Select-Object WindowsProductName, WindowsVersion, OsBuildNumber, TotalPhysicalMemory |
          Format-List

        Get-CimInstance Win32_Processor |
          Select-Object Name, NumberOfCores, NumberOfLogicalProcessors |
          Format-List

        Write-Host "OS Architecture: $env:PROCESSOR_ARCHITECTURE" -ForegroundColor White

        $os = Get-CimInstance Win32_OperatingSystem
        $totalGB = [math]::Round($os.TotalVisibleMemorySize / 1MB, 2)
        $freeGB = [math]::Round($os.FreePhysicalMemory / 1MB, 2)

        Write-Host "Total RAM: $totalGB GB" -ForegroundColor Cyan
        Write-Host "Available RAM: $freeGB GB" -ForegroundColor Cyan
        Write-Host "Used RAM: $([math]::Round($totalGB - $freeGB, 2)) GB" -ForegroundColor Cyan

    # ============================================================
    # VERIFICAR WINDOWS 11 26H2
    # ============================================================
    - name: Check Windows 11 Version
      shell: powershell
      run: |
        $os = Get-CimInstance Win32_OperatingSystem

        Write-Host "=== WINDOWS VERSION ===" -ForegroundColor Cyan
        Write-Host "Product: $($os.Caption)"
        Write-Host "Version: $($os.Version)"
        Write-Host "Build: $($os.BuildNumber)"
        Write-Host "Architecture: $($os.OSArchitecture)"

        if ([int]$os.BuildNumber -ge 26300) {
          Write-Host "Build meets the configured threshold." -ForegroundColor Green
        }
        else {
          Write-Host "Windows 11 26H2 is not confirmed." -ForegroundColor Yellow
        }

        Write-Host "A build number alone does not confirm a release." -ForegroundColor Yellow

    # ============================================================
    # WINDOWS UPDATE - MANTIDO
    # ============================================================
    - name: Update Windows 11 to 26H2
      shell: powershell
      run: |
        $ErrorActionPreference = "Continue"

        Write-Host "Checking Windows Update..." -ForegroundColor Green

        $service = Get-Service -Name wuauserv -ErrorAction SilentlyContinue

        if ($null -eq $service) {
          Write-Host "Windows Update service not found." -ForegroundColor Yellow
        }
        else {
          try {
            if ($service.Status -ne "Running") {
              Start-Service -Name wuauserv
            }

            $session = New-Object -ComObject Microsoft.Update.Session
            $searcher = $session.CreateUpdateSearcher()

            $result = $searcher.Search(
              "IsInstalled=0 and IsHidden=0 and Type='Software'"
            )

            Write-Host "Updates found: $($result.Updates.Count)" -ForegroundColor Cyan

            $updatesToInstall = New-Object -ComObject Microsoft.Update.UpdateColl

            foreach ($update in $result.Updates) {
              Write-Host "Found: $($update.Title)"

              if (
                $update.Title -match "Windows 11.*26H2" -or
                $update.Title -match "Feature update.*26H2"
              ) {
                if (-not $update.EulaAccepted) {
                  $update.AcceptEula()
                }

                [void]$updatesToInstall.Add($update)
              }
            }

            if ($updatesToInstall.Count -eq 0) {
              Write-Host "No matching 26H2 update was offered." -ForegroundColor Yellow
            }
            else {
              $downloader = $session.CreateUpdateDownloader()
              $downloader.Updates = $updatesToInstall

              $downloadResult = $downloader.Download()
              Write-Host "Download result: $($downloadResult.ResultCode)"

              if ($downloadResult.ResultCode -in @(2,3)) {
                $installer = $session.CreateUpdateInstaller()
                $installer.Updates = $updatesToInstall

                $installResult = $installer.Install()

                Write-Host "Install result: $($installResult.ResultCode)"
                Write-Host "Reboot required: $($installResult.RebootRequired)"
              }
            }
          }
          catch {
            Write-Host "Windows Update error: $($_.Exception.Message)" -ForegroundColor Yellow
            Write-Host "Continuing with the current runner image." -ForegroundColor Yellow
          }
        }

    # ============================================================
    # VERIFICACAO FINAL DO WINDOWS
    # ============================================================
    - name: Verify Windows 11 26H2
      shell: powershell
      run: |
        $os = Get-CimInstance Win32_OperatingSystem

        Write-Host "=== FINAL WINDOWS CHECK ===" -ForegroundColor Cyan
        Write-Host "Product: $($os.Caption)"
        Write-Host "Version: $($os.Version)"
        Write-Host "Build: $($os.BuildNumber)"
        Write-Host "Architecture: $($os.OSArchitecture)"

        if ([int]$os.BuildNumber -ge 26300) {
          Write-Host "Build meets the configured threshold." -ForegroundColor Green
        }
        else {
          Write-Host "Windows 11 26H2 is not confirmed." -ForegroundColor Yellow
        }

    # ============================================================
    # TPM 2.0
    # ============================================================
    - name: Fix Windows 11 TPM 2.0 Requirement
      shell: powershell
      run: |
        $ErrorActionPreference = "Continue"

        $labConfigPath = "HKLM:\SYSTEM\Setup\LabConfig"

        if (-not (Test-Path $labConfigPath)) {
          New-Item -Path $labConfigPath -Force | Out-Null
        }

        New-ItemProperty `
          -Path $labConfigPath `
          -Name "BypassTPMCheck" `
          -PropertyType DWord `
          -Value 1 `
          -Force | Out-Null

        $moSetupPath = "HKLM:\SYSTEM\Setup\MoSetup"

        if (-not (Test-Path $moSetupPath)) {
          New-Item -Path $moSetupPath -Force | Out-Null
        }

        New-ItemProperty `
          -Path $moSetupPath `
          -Name "AllowUpgradesWithUnsupportedTPMOrCPU" `
          -PropertyType DWord `
          -Value 1 `
          -Force | Out-Null

        Write-Host "TPM compatibility settings processed." -ForegroundColor Green

    # ============================================================
    # RDP
    # ============================================================
    - name: Enable RDP
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"

        Set-ItemProperty `
          -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
          -Name "fDenyTSConnections" `
          -Value 0

        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

        Set-ItemProperty `
          -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
          -Name "UserAuthentication" `
          -Value 1

        Write-Host "RDP configured." -ForegroundColor Green

    # ============================================================
    # USUARIO RAFAEL - MANTIDO
    # ============================================================
    - name: Create User Account
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"

        $Password = ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force

        if (Get-LocalUser -Name "Rafael" -ErrorAction SilentlyContinue) {
          Set-LocalUser -Name "Rafael" -Password $Password
        }
        else {
          New-LocalUser `
            -Name "Rafael" `
            -Password $Password `
            -FullName "Rafael"
        }

        Add-LocalGroupMember `
          -Group "Administrators" `
          -Member "Rafael" `
          -ErrorAction SilentlyContinue

        Add-LocalGroupMember `
          -Group "Remote Desktop Users" `
          -Member "Rafael" `
          -ErrorAction SilentlyContinue

        Write-Host "Username: Rafael" -ForegroundColor Yellow
        Write-Host "Rafael administrator configuration completed." -ForegroundColor Green

    # ============================================================
    # AUDIO
    # ============================================================
    - name: Fix Windows Audio
      shell: powershell
      run: |
        $audioServices = @("Audiosrv", "AudioEndpointBuilder")

        foreach ($service in $audioServices) {
          try {
            Set-Service -Name $service -StartupType Automatic -ErrorAction Stop
            Start-Service -Name $service -ErrorAction Stop
            Write-Host "$service started." -ForegroundColor Green
          }
          catch {
            Write-Host "$service: $($_.Exception.Message)" -ForegroundColor Yellow
          }
        }

        Get-Service -Name $audioServices -ErrorAction SilentlyContinue |
          Select-Object Name, Status, StartType |
          Format-Table -AutoSize

    # ============================================================
    # REDE
    # ============================================================
    - name: Configure Network
      shell: powershell
      run: |
        $networkServices = @("Dhcp", "Dnscache", "NlaSvc", "netprofm", "WlanSvc")

        foreach ($service in $networkServices) {
          try {
            Set-Service -Name $service -StartupType Automatic -ErrorAction SilentlyContinue
            Start-Service -Name $service -ErrorAction SilentlyContinue
          }
          catch {
            Write-Host "Service unavailable: $service" -ForegroundColor Yellow
          }
        }

        Write-Host "=== NETWORK ADAPTERS ===" -ForegroundColor Cyan

        Get-NetAdapter -ErrorAction SilentlyContinue |
          Select-Object Name, InterfaceDescription, Status, LinkSpeed |
          Format-Table -AutoSize

    # ============================================================
    # TAILSCALE - INSTALACAO ARM64
    # ============================================================
    - name: Install Tailscale (Silent)
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        $ProgressPreference = "SilentlyContinue"

        $installerPath = Join-Path $env:TEMP "tailscale-arm64.msi"
        $logPath = Join-Path $env:TEMP "tailscale-install.log"

        $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-arm64.msi"

        Write-Host "Downloading Tailscale ARM64..." -ForegroundColor Cyan
        Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

        if (-not (Test-Path $installerPath)) {
          throw "Tailscale installer download failed."
        }

        $process = Start-Process `
          -FilePath "msiexec.exe" `
          -ArgumentList @(
            "/i",
            "`"$installerPath`"",
            "/qn",
            "/norestart",
            "/L*v",
            "`"$logPath`""
          ) `
          -Wait `
          -PassThru

        Write-Host "Installer exit code: $($process.ExitCode)" -ForegroundColor Yellow

        if ($process.ExitCode -notin @(0, 3010)) {
          Get-Content $logPath -Tail 40 -ErrorAction SilentlyContinue
          throw "Tailscale installer failed with code $($process.ExitCode)."
        }

        $possiblePaths = @(
          "$env:ProgramFiles\Tailscale\tailscale.exe",
          "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe",
          "C:\Program Files\Tailscale\tailscale.exe",
          "C:\Program Files (x86)\Tailscale\tailscale.exe"
        )

        $tsExe = $null

        foreach ($path in $possiblePaths) {
          if ($path -and (Test-Path $path)) {
            $tsExe = $path
            break
          }
        }

        if (-not $tsExe) {
          throw "tailscale.exe not found after installation. See $logPath"
        }

        "TAILSCALE_PATH=$tsExe" |
          Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

        Write-Host "Tailscale installed at: $tsExe" -ForegroundColor Green

        & $tsExe version

        if ($LASTEXITCODE -ne 0) {
          throw "Tailscale executable did not start correctly."
        }

        Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

    # ============================================================
    # TAILSCALE - AUTENTICACAO E CONEXAO
    # ============================================================
    - name: Start Tailscale
      shell: powershell
      env:
        TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        $ErrorActionPreference = "Stop"

        $tsExe = $env:TAILSCALE_PATH

        if (-not $tsExe -or -not (Test-Path $tsExe)) {
          throw "tailscale.exe not found."
        }

        if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
          throw "Secret TAILSCALE_AUTH_KEY is missing. Configure it in GitHub repository secrets."
        }

        Write-Host "Checking Tailscale service..." -ForegroundColor Cyan

        $service = Get-Service -Name "Tailscale" -ErrorAction Stop

        if ($service.Status -ne "Running") {
          Start-Service -Name "Tailscale"
        }

        $serviceDeadline = (Get-Date).AddSeconds(60)

        do {
          Start-Sleep -Seconds 3
          $service.Refresh()
        } while (
          $service.Status -ne "Running" -and
          (Get-Date) -lt $serviceDeadline
        )

        if ($service.Status -ne "Running") {
          throw "Tailscale service did not start."
        }

        Start-Sleep -Seconds 5

        Write-Host "Running tailscale up..." -ForegroundColor Cyan

        # Capture stderr without allowing PowerShell to terminate
        # before the native executable's exit code is checked.
        $oldPreference = $ErrorActionPreference
        $ErrorActionPreference = "Continue"

        $upOutput = @(
          & $tsExe up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=enigmano-${{ github.run_id }}" `
            "--unattended" 2>&1
        )

        $upExitCode = $LASTEXITCODE
        $ErrorActionPreference = $oldPreference

        foreach ($line in $upOutput) {
          Write-Host "$line"
        }

        if ($upExitCode -ne 0) {
          throw "tailscale up failed with exit code $upExitCode. Check the auth key, network connectivity and service logs."
        }

        Write-Host "Waiting for Tailscale IPv4..." -ForegroundColor Cyan

        $deadline = (Get-Date).AddSeconds(90)
        $tsIP = $null

        while ((Get-Date) -lt $deadline) {
          $ErrorActionPreference = "Continue"

          $ipOutput = @(& $tsExe ip -4 2>&1)
          $ipExitCode = $LASTEXITCODE

          $ErrorActionPreference = $oldPreference

          if ($ipExitCode -eq 0) {
            $candidate = ($ipOutput | Out-String).Trim()

            if ($candidate -match '^100\.(?:\d{1,3}\.){2}\d{1,3}$') {
              $tsIP = $candidate
              break
            }
          }

          Start-Sleep -Seconds 5
        }

        if (-not $tsIP) {
          Write-Host "Tailscale did not receive an IPv4 address." -ForegroundColor Red

          $ErrorActionPreference = "Continue"
          & $tsExe status 2>&1 | ForEach-Object { Write-Host "$_" }
          $ErrorActionPreference = $oldPreference

          throw "Tailscale connection timed out. Review the status output above."
        }

        "TAILSCALE_IP=$tsIP" |
          Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

        Write-Host "Tailscale connected. IPv4: $tsIP" -ForegroundColor Green

    # ============================================================
    # VALIDAR IP DO TAILSCALE
    # ============================================================
    - name: Get Tailscale IP
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"

        $tsExe = $env:TAILSCALE_PATH
        $tsIP = $env:TAILSCALE_IP

        if (-not $tsExe -or -not (Test-Path $tsExe)) {
          throw "Tailscale executable not found."
        }

        if ([string]::IsNullOrWhiteSpace($tsIP)) {
          throw "TAILSCALE_IP was not set by the connection step."
        }

        if ($tsIP -notmatch '^100\.(?:\d{1,3}\.){2}\d{1,3}$') {
          throw "Tailscale IPv4 address is invalid."
        }

        Write-Host "Tailscale IP: $tsIP" -ForegroundColor Green

    # ============================================================
    # GOOGLE CHROME
    # ============================================================
    - name: Install Google Chrome (Direct)
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        $ProgressPreference = "SilentlyContinue"

        $chromeUrl = "https://dl.google.com/chrome/install/latest/chrome_installer.exe"
        $installerPath = Join-Path $env:TEMP "chrome_installer.exe"

        Write-Host "Downloading Google Chrome..." -ForegroundColor Green
        Invoke-WebRequest -Uri $chromeUrl -OutFile $installerPath

        $chromeProcess = Start-Process `
          -FilePath $installerPath `
          -ArgumentList "/silent /install" `
          -Wait `
          -PassThru

        Write-Host "Chrome installer exit code: $($chromeProcess.ExitCode)"

        Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

        if ($chromeProcess.ExitCode -notin @(0, 3010)) {
          throw "Chrome installation failed."
        }

        Write-Host "Google Chrome installation completed." -ForegroundColor Green

    # ============================================================
    # 7-ZIP
    # ============================================================
    - name: Install 7-Zip (Direct)
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        $ProgressPreference = "SilentlyContinue"

        $zipUrl = "https://www.7-zip.org/a/7z2409-x64.exe"
        $installerPath = Join-Path $env:TEMP "7z-installer.exe"

        Write-Host "Downloading 7-Zip..." -ForegroundColor Green
        Invoke-WebRequest -Uri $zipUrl -OutFile $installerPath

        $zipProcess = Start-Process `
          -FilePath $installerPath `
          -ArgumentList "/S" `
          -Wait `
          -PassThru

        Write-Host "7-Zip installer exit code: $($zipProcess.ExitCode)"

        Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

        if ($zipProcess.ExitCode -notin @(0, 3010)) {
          throw "7-Zip installation failed."
        }

        Write-Host "7-Zip installation completed." -ForegroundColor Green

    # ============================================================
    # DETALHES DA CONEXAO
    # ============================================================
    - name: Connection Details
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"

        $tsIP = $env:TAILSCALE_IP

        if ([string]::IsNullOrWhiteSpace($tsIP)) {
          throw "No Tailscale IP is available. RDP details cannot be confirmed."
        }

        Write-Host ""
        Write-Host "========================================" -ForegroundColor Cyan
        Write-Host "         ENIGMANO RDP ACCESS            " -ForegroundColor Cyan
 
